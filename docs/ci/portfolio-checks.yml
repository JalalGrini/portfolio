name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python tools/verify_assets.py
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke checks
        run: |
          python -m http.server 3000 --directory out &
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/ > /dev/null && break || sleep 1; done
          npm run test:e2e
          npm run test:extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-and-screenshots
          path: test-results/
          retention-days: 14
